[project]
name = WCC Companion App
full_name = Workshop Control Center - Mobile Companion Application
sole_author = Project owner
version = 1.0.0
version_code = 10000
display_version = OB1.0.0
channel = OPEN_BETA
application_id = com.wcc.companion
namespace = com.example.wcc_companion_app
description = Native Android floor-tech companion for the WCC PHP CMMS. MMM swipe navigation, offline outbox (WorkManager), plant-LAN reachability (not mere internet), tickets/WO/equipment/inventory/history, scan, biometrics (device-local only), 34-locale chrome, hybrid REST + PHP session cookie networking.
tech_stack = Kotlin, Jetpack Compose, Retrofit, OkHttp, Hilt, Room, WorkManager, Material 3, androidx.biometric, CameraX, ML Kit barcode
repository_root = .
android_module = app/
min_sdk = 23
target_sdk = 34
compile_sdk = 34

[authorship]
sole_author = Project owner
co_authors = none
ai_systems_as_authors = none
policy = All code, docs, and design under this tree are attributed solely to the project owner. Strip any third-party or AI co-author credit if found.

[initialization]
must_read_first = ai_ctxt/AGENT_INSTRUCTIONS.md
read_order =
    ai_ctxt/AGENT_INSTRUCTIONS.md,
    ai_ctxt/AUTHORSHIP.md,
    ai_ctxt/PROJECT_STATUS_OB1.0.0.md,
    ai_ctxt/STYLING_DESIGN_STANDARDS.md,
    ai_ctxt/OVERVIEW.md,
    ai_ctxt/ARCHITECTURE.md,
    ai_ctxt/KEY_FLOWS.md,
    ai_ctxt/LANGUAGES.md,
    ai_ctxt/DEVICE_TESTING.md,
    ai_ctxt/CONVENTIONS.md,
    ai_ctxt/ROADMAP_FUTURE.md

[context_layer]
folder = ai_ctxt
description = Single source of truth for agents working on the Android companion. Update when status changes.
repomix_wall = ai_ctxt/REPOMIX_SOURCE_WALL.txt
status_snapshot = ai_ctxt/PROJECT_STATUS_OB1.0.0.md

[architecture]
pattern = MVVM + Clean Architecture (UI / data / di)
di = Hilt
local_db = Room WccDatabase (tickets, WOs, reference cache, pending ops, pending media)
sync = SyncCoordinator + SyncScheduler + OutboxSyncWorker (WorkManager)
networking = Retrofit + OkHttp; DynamicBaseUrlInterceptor; AuthInterceptor (X-API-Key + Basic); CookieJar PHPSESSID for legacy PHP
ui_framework = Jetpack Compose only
shell = MainActivity (entry + login/biometric nav) -> AppShell (MMM + overlays) -> FloorOverlayState
key_components =
    MmmLayout (gesture carousel math),
    AppShell,
    FloorOverlayState,
    SyncCoordinator,
    NetworkMonitor (plant TCP probe / cellular = offline),
    WccHaptics,
    DeviceBiometricLock,
    AppLocale (34 languages),
    OpenBetaChrome

[status]
release_channel = Open Beta 1.0.0
shipped =
    offline outbox (ops + media),
    multi-tech conflict detect,
    offline photo evidence,
    offline stock mutations,
    plant-link Live badge + outbox sheet,
    keep-screen-on on job screens,
    scan jump polish,
    Mine filters,
    last-rail memory,
    haptics toggle + re-fireable motor path,
    shell phase 1 (AppShell extract),
    device-local biometrics,
    34-locale AppLocale + values-*,
    OB1.0.0 packaging (id, version, backup exclude, beta disclaimer/banner, version footer)
known_limitations =
    companion UI still partly English hardcode on overlays,
    plaintext session prefs (backup-excluded),
    debug 16KB ELF dialog from CameraX/ML Kit,
    release keystore/Play AAB not required for sideload pilot,
    shell phase 2 optional
parked =
    full companion string extraction to match web 747 keys,
    shell phase 2 rail coordinators,
    EncryptedSharedPreferences,
    force-update API

[styling]
system = Glassmorphism & industrial floor UX
authority = ai_ctxt/STYLING_DESIGN_STANDARDS.md
components = Orbiter menus, rail tokens in RailContainers.kt, translucent surfaces, gesture-bound motion
rules = No generic Material dialogs for primary chrome; imePadding on forms; chips inside cards

[conventions]
code_style = Idiomatic Kotlin + declarative Compose
state = StateFlow in ViewModels; remember/mutableStateOf for local UI
networking = WccApiService; DynamicBaseUrl-Skip for non-v1 paths; silent loginForm for cookie
offline = Room DIRTY/PENDING + WorkManager drain when plant reachable
security = Biometric lock never syncs to plant DB; prefs key biometric_lock local only

[qa]
device = SM-A566B (primary)
reports =
    qa_ob100/OPEN_BETA_1.0.0_REPORT.md,
    qa_shell_drive/QA_REPORT.md,
    qa_launch/QA_REPORT.md,
    qa_qol_drive/QA_REPORT.md
adb_package = com.wcc.companion
main_activity = com.wcc.companion/com.example.wcc_companion_app.MainActivity
demo_login_note = Use plant-provided demo accounts only (never commit real credentials)

[rules_for_agents]
1 = ALWAYS read [initialization] files before code changes.
2 = Sole author is the project owner — never add co-author or AI-as-author credits.
3 = Prefer in-app fixes; do not rewrite plant main DB / production PHP schema unless the human author explicitly orders it.
4 = Respect Glassmorphism + STYLING_DESIGN_STANDARDS.md.
5 = MmmLayout uses continuous distance math — no boolean animation cuts mid-drag.
6 = Plant offline = plant unreachable or cellular (NetworkMonitor), not mere INTERNET flag.
7 = Outbox + media must survive process death (WorkManager).
8 = Biometrics: device-local only; no users table / API field.
9 = Locales: 34 codes match web catalog; regenerate strings via tools/gen_locale_strings.py when needed.
10 = Open Beta: version 1.0.0 / OB1.0.0; applicationId com.wcc.companion.

