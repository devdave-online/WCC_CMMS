; =============================================================================
; WCC CMMS — AI Agent Initialization File (source of truth for session bootstrap)
; =============================================================================
; Audience: any AI AGENT working on this repository.
; Purpose: Put every agent on the SAME page: product intent, release state,
;          architecture, constraints, and "do / don't" rules.
;
; HOW TO START A SESSION (mandatory)
;   1. Load this file from the project root.
;   2. Read [initialization] must_read_first files in order.
;   3. Optionally: php _ai_ctxt/print-init-summary.php
;   4. For live DB counts: GET /api/v1/ai-context?live=1 (API key) OR
;      php _ai_ctxt/generate-context.php --live
;
; Optional local overrides: ai_agent.local.ini (from ai_agent.local.ini.example).
; =============================================================================

[project]
last_updated = 2026-07-28 17:05:00
name = WCC CMMS
full_name = Workshop Control Center — Computerized Maintenance Management System
version = OB1.0.0
version_sources = version.json (About modal + docs.php) AND inc/version.php WCC_UI_VERSION (asset cache-bust)
codename = Unified Horizon
release_type = Open Beta
deployment_model = Offline / on-prem only — ONE install per site / domain. NOT multi-tenant SaaS. NOT a hosted live demo.
hardlocks = NONE — no license kill-switches, no geo locks, no forced online mode, no feature paywall code.
description = Custom raw-PHP CMMS for manufacturing workshops. Full maintenance lifecycle: tickets, work orders/PM, equipment + tooling, inventory, procurement, users/RBAC (24 perms), i18n (34 locales, English reference), REST v1, companion-compatible APIs (separate package), in-app docs.
tech_stack = PHP 8 (raw, no framework), MariaDB/MySQL + PDO, Vanilla JS + CSS design tokens, session auth + X-API-Key REST, RBAC
repository_root = .
date_created = 2026-07-13
open_beta_docs = docs/OPEN_BETA.md, docs/DISTRIBUTION_CHECKLIST.md, docs/README_OPEN_BETA.txt

[product_owner_intent]
persona = Senior PM + Product Owner briefing for engineering agents
north_star = Technician-first shop-floor CMMS: fast fault → fix → close → learn; no enterprise bloat.
primary_users = Operators (log), Technicians (do), Supervisors (close/approve), Storekeepers (fulfil POs), Admins (configure), Managers (KPIs)
what_we_ship_now = Open Beta OB1.0.0 full feature set for offline plant installs
what_we_do_not_ship = Shared public multi-tenant demo; remote license control; native QA of every language by speakers
localization_policy = 34 language packs ship with key parity vs en; English is authoritative; imperfect translations are expected in open beta; missing keys fall back to English. Do NOT add "high impact" language tiers or hardlocks on locales.
companion_policy = Companion Android app is a SEPARATE package/hive. Do not rewrite companion endpoints to force REST. REST and companion may both talk to the same DB with different contracts.
success_for_open_beta = Site can install offline, run critical ticket path, manage assets/tooling/inventory/procurement, backup DB, report bugs/translations.

[release_status]
status = Soft-launch quality gates PASSED on restored workshop_db (2026-07-28); declared Open Beta OB1.0.0 for offline distribution
qa_evidence = tests/full_audit/reports/LAUNCH_SIGNOFF_20260728.md
security_gates = 20/0
full_audit_mutate = 0 FAIL (re-run on live DB after MySQL recovery)
rest_v1 = pass>=67 fail=0 skip=1 (includes full /toolings CRUD + bom + documents as of 2026-07-28)
fqa_manual_path = 27/0 (critical path HTTP driver)
cqa_static = 54/0
residual_ops_risk = MariaDB must be running; unclean shutdowns hurt XAMPP installs — operational, not product hardlock
backup_seed = backups/pre_launch_20260727_220101/workshop_db_*.sql (and package sql/ when distributing)

[initialization]
must_read_first = _ai_ctxt/AGENT_INSTRUCTIONS.md, _ai_ctxt/PRODUCT_STATUS.md, _ai_ctxt/OVERVIEW.md
read_order =
    _ai_ctxt/AGENT_INSTRUCTIONS.md,
    _ai_ctxt/PRODUCT_STATUS.md,
    _ai_ctxt/OVERVIEW.md,
    _ai_ctxt/ARCHITECTURE.md,
    _ai_ctxt/DATA_MODEL.md,
    _ai_ctxt/KEY_FLOWS.md,
    _ai_ctxt/CONVENTIONS.md,
    _ai_ctxt/REST_API.md,
    _ai_ctxt/context.json
machine_readable_context = _ai_ctxt/context.json
manifest = _ai_ctxt/manifest.json
human_docs = docs.php (in-app), docs/OPEN_BETA.md, docs/GETTING_STARTED.md

[context_layer]
folder = _ai_ctxt
description = Single source of truth for AI understanding. Update when product state or architecture changes.
generator_script = _ai_ctxt/generate-context.php
generator_usage = php _ai_ctxt/generate-context.php [--live]
print_summary_script = _ai_ctxt/print-init-summary.php
print_summary_usage = php _ai_ctxt/print-init-summary.php

[api]
base_url = /api/v1/
ai_context_endpoint = /ai-context
auth_methods = X-API-Key header (preferred), Basic Auth, session fallback for browser
note = REST is the integration surface. Companion uses /api/companion/* separately — leave companion code alone unless explicitly asked.
resources_core = users, roles, equipment, toolings, production-lines, tickets, ticket-actions, work-orders, inventory, vendors, purchase-orders, purchase-requests, stats, audit, api-keys, ai-context, me
toolings_rest = GET/POST/PUT/DELETE /toolings; /toolings/{id}/bom; /toolings/{id}/documents — perms view_toolings/manage_toolings; DELETE is soft-delete
companion_toolings = /api/companion/toolings.php + scan_lookup.php (DO NOT break for REST work)
web_tooling_helpers = /api/get_tooling_bom.php, /api/get_tooling_docs.php, /api/upload_document.php entity=tooling

[architecture]
folder_convention = Domain modules use leading underscore: _maint, _eam, _logi, _mgmt, _prod, _rpt, _trck
root_files = auth.php, rbac.php, nav.php, login.php, register.php, my_profile.php, index.php, docs.php, _about_modal.php, version.json
key_shared = inc/db.php, inc/session.php, inc/csrf.php, inc/head.php, inc/version.php, inc/i18n.php, inc/notifications.php, js/wcc-ui.js, css/global.css, lang/*.json
reserved_modules = _qual, _cmms, _erp, _mes (placeholders)
tests = tests/security_gates.php, tests/full_audit/*
docs_registry = docs/registry.php + docs/chapters/*

[rbac]
permissions_count = 24
permission_keys = view_tickets, create_tickets, takeover_tickets, closeout_tickets, view_history, view_statistics, view_equipment, manage_equipment, view_toolings, manage_toolings, view_inventory, manage_inventory, view_vendors, manage_vendors, view_purchase_requests, create_purchase_requests, approve_purchase_orders, fulfill_purchase_orders, view_work_orders, manage_work_orders, manage_users, manage_settings, reset_passwords, delete_users
roles = 1=Operator, 2=Technician, 3=Supervisor, 4=Admin, 5=Custom Viewer (empty base), 6=Storekeeper
authority = DB role_definitions is editable source of truth; rbac.php ROLE_PERMISSIONS is fallback for levels 1-4
tooling_split = view_toolings (ledger + BOM/docs APIs) independent of equipment; manage_toolings (vault). Flush via user checkbox / role presets.
procurement_split = approve_purchase_orders (cost) vs fulfill_purchase_orders (ship/receive)

[data_model]
live_db = workshop_db (MariaDB). Live schema wins over schema.sql when they drift.
migrations_latest = 0021_add_locale_to_users (also 0017-0019 toolings, 0020 closed_at)
important_tables = active_tickets(+closed_at), ticket_actions(action_taken), toolings, tooling_bom, tooling_documents, equipment(+deleted_at), users(+locale, permissions_json, api_key), role_definitions, notifications, purchase_orders
per_user_json = permissions_json, admin_layout_json, theme_prefs_json(dormant), api_key, locale

[i18n]
locales = 34
keys_en = ~747
policy = equal geographic groups in profile picker — no high-impact ranking
fallback = English merge on missing keys
boot = inc/i18n.php wcc_i18n_boot / __() / __e()
profile = my_profile.php save_locale → users.locale

[workflows]
core = Ticket register→takeover→escalate/hold→closeout→history; instant resolve; WO/PM; tooling+equipment ledger; inventory consume+auto-reorder; procurement PR→approve→fulfil; notifications bell
detailed = _ai_ctxt/KEY_FLOWS.md

[styling]
system = Unified Design System v2 css/global.css tokens
shell = $page_title; require inc/head.php; then nav.php
cache_busting = WCC_UI_VERSION = OB1.0.0 in inc/version.php — bump when shipping CSS/JS changes (may stay in sync with release or diverge only if intentionally cache-busting mid-release)
themes = dark default + light via localStorage theme
components = wcc-card, btn-*, wcc-modal, showToast, table drag-filter, match count helpers

[rules_for_agents]
1 = ALWAYS read initialization files before proposing code changes.
2 = Raw PHP only — no Laravel/Symfony/ORM introductions unless the human explicitly orders a rewrite.
3 = Root-absolute URLs for cross-module links and assets (/_maint/..., /css/...).
4 = Enforce RBAC server-side (require_perm / require_api_perm / api_guard_perm) — never UI-only.
5 = CSRF on browser state-changing POSTs (wcc_csrf_require_json / token in WCC_CSRF).
6 = Companion (/api/companion/*) is a separate hive — do not "migrate" it into REST unless asked; do not break it when adding REST.
7 = Do NOT add hardlocks, license checks, forced online calls, or demo-only feature flags that disable plant use.
8 = Do NOT invent "high impact" language tiers; keep locale groups equal.
9 = Prefer soft-delete patterns where schema has deleted_at (toolings REST DELETE is soft).
10 = Ticket public IDs are TK-… strings; REST GET by numeric id is 404 by design.
11 = ticket_actions column is action_taken (not notes); vendors use vendor_address (address alias on write where implemented).
12 = After schema changes: migration file + update _ai_ctxt/DATA_MODEL.md + run generate-context.php.
13 = After major product status changes: update PRODUCT_STATUS.md, context.json, this ini, OVERVIEW.md.
14 = Shop-floor practicality > elegant abstraction. Keep queries explicit and auditable.
15 = Offline install: MySQL must be up or app 500s — document ops, do not paper over with fake data layers.

[how_to_use_with_multiple_agents]
1 = Every agent loads the same ai_agent.ini from project root.
2 = After one agent ships a structural change, others re-read PRODUCT_STATUS + touched context files.
3 = Use REST /ai-context?live=1 for shared live counts when DB is available.
4 = Quick sync: php _ai_ctxt/print-init-summary.php

[environment_overrides]
optional_file = ai_agent.local.ini
example = ai_agent.local.ini.example
load_order = ai_agent.ini then ai_agent.local.ini

