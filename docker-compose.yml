# WCC CMMS — one-command demo stack.
#
#   docker compose up          → app on http://localhost:8080 with the demo loaded
#   docker compose down        → stop
#   docker compose down -v      → stop and wipe the database (next 'up' reloads the demo)
#
# The database container auto-loads docker/initdb/00_wcc_demo.sql on first boot, so
# there is nothing to migrate or seed — it comes up fully populated.

services:
  db:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: workshop_db
      MARIADB_USER: wcc
      MARIADB_PASSWORD: wccpass
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro   # runs the snapshot on first boot
      - wcc_db_data:/var/lib/mysql                        # persists between runs
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    environment:
      WCC_DB_HOST: db
      WCC_DB_PORT: "3306"
      WCC_DB_NAME: workshop_db
      WCC_DB_USER: wcc
      WCC_DB_PASS: wccpass
      # Public showcase guard: visitors can explore and create, but cannot wipe the
      # database, delete records, or take over accounts. Delete this line (or set it
      # to 0) when running your own instance — every feature unlocks.
      WCC_DEMO_MODE: "1"
      # Only addresses listed here may set X-Forwarded-For/Proto. This is the
      # Docker bridge range, i.e. the Caddy container in front of us. Without it
      # every visitor would share one apparent IP and throttle each other.
      WCC_TRUSTED_PROXIES: "172.16.0.0/12,127.0.0.1"
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy   # app waits until the demo has finished loading
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # HTTPS front door — OPT-IN, only starts with:  docker compose --profile public up -d
  #
  # Plain `docker compose up` (the local/self-host case) leaves this out entirely,
  # so nobody trying WCC on their laptop waits on certificate issuance.
  #
  # Requires ports 80 and 443 open to the internet, and WCC_PUBLIC_HOST to be a
  # hostname that resolves to this machine.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    environment:
      WCC_PUBLIC_HOST: ${WCC_PUBLIC_HOST:-141.147.117.183.nip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates live here — MUST persist or every
      - caddy_config:/config   # restart re-requests and burns Let's Encrypt quota
    depends_on:
      - app
    restart: unless-stopped

volumes:
  wcc_db_data:
  caddy_data:
  caddy_config:
